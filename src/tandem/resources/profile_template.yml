# ─────────────────────────────────────────────────────────────────────────────────────────
#  tandem profile
#
#  A profile is a task — what to do, how to plan it, and the planner's settings for it —
#  and every trajectory collected for it, in trajectories/<name>/{eval,success,failure}/.
#  This machine's robot, cameras and calibration are not here: they are the rig
#  (`tandem rig show`), which every profile shares.
#
#  Edit with `tandem profile edit <name>`; it re-validates on save and refuses to write a
#  file that would fail at session start.
# ─────────────────────────────────────────────────────────────────────────────────────────
# 3: one file per profile, the task's settings only.
version: 3
description: ''

task:
  # The language label stored with every episode — what a policy trained on this data reads.
  prompt: Place the toys on the plate with no collisions
  # The goal handed to the planner, when it has to differ from the label above (e.g. the
  # demonstration does something the on()/holding() goal language cannot express). Leave
  # null and the two are the same thing.
  goal: null
  target_episodes: 20

# ─────────────────────────────────────────────────────────────────────────────────────────
#  planner  —  which task and motion planner tandem calls, and its own settings
#
#  tandem plans the task itself: it decides the phases, which are yours and which are the
#  robot's, runs your legs as teleop, and asks a planner only for "achieve this goal in this
#  scene". Which planner that is, is a setting — an unknown name is an error, never a silent
#  fallback, because a dataset collected against a different planner from the one the config
#  named is a dataset nobody can interpret afterwards. `tandem planners list` shows them all.
#
#  `options` is the planner's own settings for this task, and the planner checks them when
#  the profile loads: a key it does not read is refused, not ignored. What it needs of the
#  machine (the robot's ports, a grasp server) is the rig's. `tandem planners info <name>`
#  lists both; `tandem profile show <name> --planner` shows what it will receive.
#  The options below are TiPToP's. Switching planner (`tandem planners use`) replaces them.
# ─────────────────────────────────────────────────────────────────────────────────────────
planner:
  backend: tiptop
  options:
    # ── TAMP settings ────────────────────────────────────────────────────────────────────
    # Passed straight through to cuTAMP and cuRobo. The key names are tiptop's own, so
    # anything documented upstream works here verbatim and an existing cfg/tamp/*.yml can be
    # pasted in unchanged. Unknown keys are rejected at load time — a silently ignored
    # override is the one failure mode that looks like success.
    tamp:
      # Solver effort. More particles cover the grasp/placement space better per skeleton;
      # more steps optimize each skeleton harder. Both cost GPU memory and planning time.
      num_particles: 256
      opt_steps_per_skeleton: 250

      # Charge each move the infinity-norm ||q1 - q2||_inf (max joint displacement) instead
      # of the default Euclidean distance. Must be the string "inf" — this round-trips
      # through JSON, which has no Infinity literal. tandem accepts `inf`, `.inf` or
      # `infinity` and normalises.
      traj_length_norm: inf

      # Prefer grasps that reorient the wrist less: weight on the geodesic angle between
      # each grasp's EE orientation and the arm's initial one. Absent or 0 disables it.
      grasp_pose_change_weight: 0.1

# ─────────────────────────────────────────────────────────────────────────────────────────
#  Phase planning  —  the deep human-in-the-loop mode
#
#  Off by default. Turned on, a VLM breaks the instruction into an ORDERED list of phases,
#  each one either a sub-goal for the planner or something only a person can do. It invents
#  the predicate it needs to describe the human's part, hands that phase over with written
#  instructions, and checks from a photo that it happened.
#
#  Phases rather than one final-state goal because the ordering runs both ways: "put the toy
#  on the cloth, then fold it" needs the human last, "open the box, then put the toy in"
#  needs the robot last, and some tasks need an intermediate state no final-state goal can
#  express at all.
#
#  Each rollout then drops a hitl.json (the phases, the invented predicates, per-clause
#  coverage and every verification verdict) and a vlm/ folder holding each image sent to the
#  model and a rendered PNG of what it answered — rejected attempts included.
#
#  Disabled, none of this is even imported and a session behaves exactly as it always has;
#  you can still hand the arm over yourself whenever you like.
# ─────────────────────────────────────────────────────────────────────────────────────────
hitl:
  enabled: false
  # Splitting a task and inventing a predicate is reasoning, not localisation, so this is a
  # general model with thinking left on — not the detection model perception uses.
  proposal_model: gemini-2.5-pro
  # Grounding ("is the cloth folded?") is one visual judgement over one image, and it is the
  # query a run pays for repeatedly.
  vlm_model: gemini-2.5-flash
  # Reprompts allowed when a proposal comes back unparseable. The error is fed back to the
  # model, which is what makes a second attempt worth making. Also the most re-plans one
  # attempt gets under `on_robot_phase_failure: replan`.
  max_attempts: 3
  # Classify the invented predicates on the first image, before anything runs. Off by
  # default: a human is asked precisely because the predicate is false. Worth turning on for
  # a scene that may start already solved.
  classify_initial: false

  # ── checking your steps ──────────────────────────────────────────────────────────────
  # Extra chances at a human step the check says did not happen. A demonstration should not
  # be thrown away because one classifier call went the wrong way.
  verify_retries: 1
  # Treat a failed check as a rollout failure. Set false while calibrating the classifier
  # prompts: the verdict is still recorded, the run just carries on.
  verify_enforced: true
  # What becomes of an attempt whose step still fails its check once the retries are spent.
  #   exclude  it is kept out of the dataset, as the paper does: filed under failure/ with
  #            `excluded: true`, its verdicts and raw recordings kept so you can see why,
  #            and you are not asked to label it
  #   label    you are asked to label it like any other attempt, and your answer decides
  # `exclude`, because a check you can overrule by answering "success" is not a filter on
  # what the dataset contains. `label` is for calibrating the classifier, where every time
  # you and the check disagree is the thing you are measuring.
  on_verification_failure: exclude
  # Check the last step too when it is yours. Set false to leave the last step to your label
  # alone, which is what the reference implementation did; the paper checks every one.
  verify_final_phase: true
  # Which camera the verification photo comes from. Third-person by default: after a hand-off
  # the arm is wherever you left it, so a wrist view points nowhere useful.
  verification_camera: external

  # ── what is put to a camera ──────────────────────────────────────────────────────────
  # Every human step comes with a contract — what must be true before it, what it makes
  # true, what it makes false — and every robot step has its goal. These say which halves a
  # camera is actually asked about. Each costs one model call per statement, with the arm
  # parked, so only the one nothing else can answer is on:
  #   check_human_effects        whether your step happened at all. Nothing else can tell.
  #   check_human_preconditions  usually redundant: check_plan_effects below already proved
  #                              the plan sets them up. Off in the paper's experiments. Turn
  #                              it on when a step keeps failing and you suspect it was never
  #                              set up properly.
  #   check_tamp_preconditions   guards a robot step against a stale belief about the scene.
  #   check_tamp_effects         the planner already reports whether it did its step, and
  #                              better than a third-person camera can see it.
  # A failed check is recorded in hitl.json either way.
  check_human_effects: true
  check_human_preconditions: false
  check_tamp_preconditions: false
  check_tamp_effects: false
  # Stop when a checked precondition does not hold. Off, the verdict is recorded and the step
  # goes ahead: one classifier call should not cost you a demonstration.
  precondition_enforced: false
  # Check the steps' contracts against each other before the arm moves, and send a plan
  # that undoes something a later step needs ("close the box" before "put the toy in the
  # box") back to the model to fix. Symbolic, so it costs no model call and no time.
  check_plan_effects: true

  # ── carrying the plan out ────────────────────────────────────────────────────────────
  # What happens when the planner cannot plan one of the robot's steps.
  #   abort   the attempt ends as a failure
  #   teleop  the sub-goal is described to you and you do it by hand, checked exactly as any
  #           other human step, and the task carries on
  #   replan  the failure is handed back to the model, which decomposes the task differently
  #           (at most max_attempts times, then the attempt ends as with abort)
  # `abort`, because that is what the paper measured: it counts a planner failure as a
  # failed attempt. With `teleop` a robot step becomes yours, so a dataset collected that
  # way credits the method with attempts it did not complete, and understates how much of
  # the work you did. Choose `teleop` when all you want is demonstrations. A step that WAS
  # planned but failed while the arm was executing it always ends the attempt.
  on_robot_phase_failure: abort
  # Plan consecutive robot steps as one goal where that is sound: one continuous motion,
  # and no re-perception in between for the object labels to drift across. Set false to
  # re-perceive before every robot step, at the cost of the arm stopping between them.
  conjoin_robot_phases: true
  # Who carries out a human step. `teleop` — you, driving the arm — is the only one that
  # ships; others can be installed and registered under their own name.
  human_executor: teleop
  # Each executor's own settings, under its name (a policy executor's checkpoint, say).
  # Kept per executor, so switching to another one and back loses nothing. Teleop has none.
  human_executor_options: {}
  # Allow answering "done" for a human step without teleoperating it while recording. That
  # step then has no recording, and the episode is missing exactly the demonstration it
  # exists to capture while looking complete. Always allowed when nothing is recorded.
  allow_unrecorded_human_phase: false

  # Write every image sent to the model, and a rendered PNG of its answer, into vlm/.
  save_vlm_io: true
  # SQLite cache for proposals only, useful while iterating on prompts. Never applied to
  # grounding or verification.
  cache_path: null

# recording: whether camera video is captured during execution (at each camera's rate, the rig's).
recording:
  enabled: true

# Where `tandem export lerobot` pushes. Leave hf_repo blank until you need it.
export:
  hf_repo: ''
  private: false
