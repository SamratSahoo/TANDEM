version: 2
name: bread-box
description: the bread box, collected on the FR3
task:
  prompt: place the bread on the plate, and then open the box and place the bread in the box
  target_episodes: 20
cameras:
  perception: external
  hand:
    serial: '14846828'
    type: zed
    resolution: HD720
    fps: 15
  external:
    serial: '32439448'
    type: zed
    resolution: HD720
    fps: 15
  external_2:
    serial: '31425515'
    type: zed
    resolution: HD720
    fps: 15
hitl:
  enabled: true
  proposal_model: gemini-2.5-pro
  vlm_model: gemini-2.5-flash
  max_attempts: 3
  classify_initial: false
  verify_retries: 1
  verify_enforced: true
  on_verification_failure: exclude
  verify_final_phase: true
  check_human_effects: true
  check_human_preconditions: false
  check_tamp_preconditions: false
  check_tamp_effects: false
  precondition_enforced: false
  check_plan_effects: true
  save_vlm_io: true
  on_robot_phase_failure: abort
  conjoin_robot_phases: true
  human_executor: teleop
  human_executor_options: {}
  allow_unrecorded_human_phase: false
  verification_camera: external
planner:
  backend: tiptop
  options:
    robot:
      type: fr3_robotiq
      dof: 7
      host: 10.0.0.5
      port: 5555
      gripper_port: 5559
      state_port: 5557
      time_dilation_factor: 0.3
      q_home:
      - 0.0
      - -0.628
      - 0.0
      - -2.513
      - 0.0
      - 1.885
      - 0.0
      q_capture:
      - -0.034
      - 0.09
      - 0.08
      - -1.319
      - -0.003
      - 1.253
      - 0.03
    perception:
      gemini:
        model: gemini-robotics-er-2-preview
      m2t2:
        url: http://gpu:8123
        apply_bounds: true
      sam_mode: local
      depth_smoothing_frames: 5
      robot_mask_margin_m: 0.02
      depth_trunc_m: 5.0
      voxel_downsample_size: 0.0075
      contact_threshold_m: 0.01
      mask_erosion_pixels: 3
    tamp:
      num_particles: 512
      opt_steps_per_skeleton: 250
      traj_length_norm: inf
      grasp_pose_change_weight: 0.1
recording:
  enabled: true
  fps: 15
export:
  hf_repo: ''
  private: false

