tamp_overrides:
  vae_retiming: false          
  vae_manifold_weight: 25000   
  vae_path: "vae/checkpoints/vae_full_v2.pt"   
  joint_density_weight: 0
  uniform_velocity_weight: 0.0
  traj_length_norm: "inf"
  grasp_pose_change_weight: 0
  # grasp_center_weight: 30
  # grasp_threshold: 0.02
  m2t2_num_runs: 60
  require_m2t2_grasps: false
  # Place where the toy would actually come to REST on the cloth, at that height, instead of
  # anywhere in the cloth's bounding box at the height of its highest vertex. The cloth reconstructs
  # as a thick convex hull: measured on eval/2026-09-14_21-28-47 the bounding-box region is 29 x 29
  # cm of valid centres releasing the toy's bottom at z = 0.008, while the observed cloth surface is
  # at z = -0.015 and the puzzle board's top is at z = 0.002. So the toy is let go 2.3 cm above the
  # cloth and 6 mm above the BOARD, over a region that includes the board's whole footprint, and the
  # traj-length cost pulls the placement back toward the pick -- which is on the board. That run is
  # On(pink_toy, yellow_cloth) "satisfied" by dropping the toy back onto the puzzle. Fitted to the
  # cloth's own points the region is instead 24 x 6.5 cm of bare cloth at z = -0.015, 100% observed
  # and clear of the board in y: the board occludes the cloth beneath it, so those cells read as
  # unobserved and nothing may rest there. See tiptop resolve_placement_support.
  placement_support: true
  # Fail the leg when no patch of cloth would hold the toy rather than falling back on the bounding
  # box -- the fallback is exactly the behaviour above, and a bunched cloth is better handed to the
  # operator than answered by dropping the toy on the board.
  placement_support_required: true
  # Load-bearing here, and the default with placement_support: the toy resting on the real cloth at
  # z = -0.015 sits INSIDE that hull (z = -0.021 to 0.008), so without it every such placement scores
  # as a collision with the cloth and only the hull's top -- board height -- is left. The board is a
  # separate obstacle and is still screened normally.
  placement_into_surface: true
  # Margin (1 cm) and flatness tolerance (8 mm) stay at their defaults: measured on the run above
  # they leave a 24 x 6.5 cm, 100%-observed region, which is far more than the toy's 5.2 cm swept
  # disc needs.
  # voxel_downsample_size: 0.005
  num_particles: 512
  opt_steps_per_skeleton: 600
  transit_apex_height: 0.075
  transit_apex_min_dist: 0.10
  time_dilation_factor_literal: 1.0
  posture_selection_seeds: 12
  posture_grasp_roll: true
  blend_trajectory: true
  blend_mode: vae
  blend_ops: [Pick, MoveFree, MoveHolding, Place, GoToInitial]
  blend_smoothing: 3.0e-4
  blend_boundary_speed: 0.07
  blend_vae_sample_target: false
  blend_max_duration_mult: 2.0
  blend_vel_slack: 1.0
  blend_acc_slack: 1.0

hitl:
  enabled: true
  proposal_model: "gemini-2.5-pro"
  vlm_model: "gemini-2.5-flash"
  verify_retries: 1
  verify_enforced: true
  save_vlm_io: true
  classify_initial: false

  # ---- the human-operator contract ---- #
  # Every human phase is proposed as an explicit operator -- Push(box) with its preconditions and
  # its add/delete effects -- in the shape cuTAMP states its own. It is never searched over (the
  # phase order is already fixed by the proposer); it is a contract, and these keys say which halves
  # of it are actually enforced or put to a camera.

  # Symbolic, before the arm moves and before any image is classified: walk the phase list and
  # refuse a plan that deletes a precondition a later phase needs. Costs no VLM call, and the
  # rejection goes back to the proposer through the reprompt loop, so it usually self-corrects.
  check_plan_effects: true

  # Before each human phase: are its declared preconditions true in the workspace right now? OFF --
  # the plan-time check above already proved the plan establishes them, so this mostly re-asks a
  # question already answered, at one VLM call per checkable atom with the arm parked. Worth turning
  # on when a human phase keeps failing and it is not clear whether it was ever set up properly.
  check_human_preconditions: false
  # After each human phase: its add effects must hold AND its delete effects must not. This is the
  # check that has always run; with an operator it now also catches what the step failed to undo.
  check_human_effects: true

  # Before each robot leg: are the beliefs earlier phases are on the hook for still true? OFF -- it
  # lands between perception and cuTAMP with the arm parked, and these runs would rather spend that
  # time collecting. Turn on to catch the human phase that verified as done but left the world
  # otherwise, before cuTAMP plans onto it.
  check_tamp_preconditions: false
  # After each robot leg. OFF: cuTAMP either found and executed a plan for On(bread, plate) or it
  # reported that it could not, and the arm's own account of that beats a third-person camera.
  check_tamp_effects: false

  # An unmet precondition is recorded and reported, but does NOT stop the plan or withhold the arm.
  # Off while the classifier prompts are still being calibrated: one bad VLM call must not cost an
  # operator a demonstration. Turn on to make the contract binding.
  precondition_enforced: false
hugginface_slug: "1_toy_puzzle"

prompt: "place the toy on the cloth and solve the puzzle"
num_episodes: 20

