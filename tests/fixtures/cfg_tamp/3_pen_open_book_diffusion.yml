tamp_overrides:
  vae_retiming: false          
  vae_manifold_weight: 25000   
  vae_path: "vae/checkpoints/vae_full_v2.pt"   
  joint_density_weight: 0
  uniform_velocity_weight: 0.0
  traj_length_norm: "inf"
  grasp_pose_change_weight: 0
  # grasp_center_weight: 30
  # grasp_threshold: 0.02
  m2t2_num_runs: 60
  require_m2t2_grasps: false
  # voxel_downsample_size: 0.005
  num_particles: 512
  opt_steps_per_skeleton: 600
  transit_apex_height: 0.075
  transit_apex_min_dist: 0.10
  time_dilation_factor_literal: 1.0
  posture_selection_seeds: 12
  posture_grasp_roll: true
  blend_trajectory: true
  blend_mode: vae
  blend_ops: [Pick, MoveFree, MoveHolding, Place, GoToInitial]
  blend_smoothing: 3.0e-4
  blend_boundary_speed: 0.07
  blend_vae_sample_target: false
  blend_max_duration_mult: 2.0
  blend_vel_slack: 1.0
  blend_acc_slack: 1.0

hitl:
  enabled: true
  proposal_model: "gemini-2.5-pro"
  vlm_model: "gemini-2.5-flash"
  verify_retries: 1
  verify_enforced: true
  save_vlm_io: true
  classify_initial: false
  # Who carries out the plan's HUMAN phases (ARCHITECTURE.md §6e). "human" (the default) hands the
  # arm to a teleoperator; "diffusion" hands it to the policy below, which was behaviour-cloned on
  # the teleop legs of earlier runs of THIS task. Everything else about the plan is unchanged --
  # same phases, same sub-goals, same VLM check afterwards, same merged episode.
  #
  # The longest human legs of the five tasks by some way (up to 648 frames), which is the whole
  # reason max_steps is 780 here and 450 for the toy puzzle.
  #
  # The human never commanded the gripper on this task's legs, so that action channel is a
  # constant and the policy cannot work the fingers -- it opens the book with a closed hand, as
  # the demonstrations did. TAMP hands over empty-handed, so nothing is dropped.
  policy_type: diffusion # or human (default: human)
  policy_checkpoint: "/home/prpl/hitl-tamp-vla/hitl-baseline/diffusion_policy/checkpoints/3_pen_open_book/checkpoints/last"
  # Steps of one predicted chunk run before the policy is asked again (LeRobot's n_action_steps).
  # Must be <= horizon - n_obs_steps + 1 = 15 for these checkpoints; hitl_dp.serve checks it. Higher
  # means fewer re-plan stalls and more open-loop drift.
  open_loop_horizon: 15
  # Reverse-diffusion steps per prediction. LeRobot defaults this to num_train_timesteps = 100, which
  # takes ~334 ms and stalls the 15 Hz loop for five periods on every eighth step -- the 2026-09-09
  # leg ran at 9.2 Hz for exactly this reason. 10 steps take 36 ms and predict the same actions
  # (cosine 0.867 vs 0.866 against the demonstrated action, replayed over a full teleop leg).
  policy_num_inference_steps: 10
  # How long one policy leg runs, in control steps at 15 Hz. A BC policy has no termination signal,
  # so this ends the leg and the phase verification decides whether it worked. Sized at ~1.2x the
  # longest human leg of this task, whose legs run 275 / 390.5 / 648 frames (min/median/max).
  policy_max_steps: 780
  # Scales the joint-velocity channels (not the gripper) on the way to the arm. 1.0 sends what the
  # policy predicted, which is what the training data's units mean. Raise it only as a DIAGNOSTIC:
  # a policy that under-drives is usually being handed a pose or a view its demos never contain
  # (FILTERING.md §5), and scaling amplifies the error along with the intent.
  policy_velocity_scale: 1.0

hugginface_slug: "3_pen_open_book_diffusion"

prompt: "take the marker off of the book and place it on the wooden tray, then open the book"
num_episodes: 20

