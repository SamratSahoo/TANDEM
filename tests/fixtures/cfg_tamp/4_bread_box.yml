tamp_overrides:
  vae_retiming: false          
  vae_manifold_weight: 25000   
  vae_path: "vae/checkpoints/vae_full_v2.pt"   
  joint_density_weight: 0
  uniform_velocity_weight: 0.0
  traj_length_norm: "inf"
  grasp_pose_change_weight: 0
  # grasp_center_weight: 30
  # grasp_threshold: 0.02
  m2t2_num_runs: 60
  require_m2t2_grasps: false
  # Place where the object would actually come to REST with support all around it, at that height,
  # instead of anywhere in the surface's bounding box at the height of its highest vertex. For this
  # task's box that vertex is the top of the folded-back lid: failure/2026-09-07_13-39-40 released
  # the bread ~19 cm up and out over the far wall, and it fell. See tiptop resolve_placement_support.
  placement_support: true
  # 5 mm, not the 1 cm default: this box's usable tray floor is barely wider than the bread, and
  # the margin comes off both sides of it. Measured on 2026-09-07_16-01-00, 1 cm leaves a 0.5 x
  # 0.5 cm region -- one cell, nowhere for the optimizer to move -- and 5 mm leaves 4.0 x 1.0 cm.
  placement_support_margin: 0.005
  # Fail the plan when nothing on the surface would hold the object, rather than falling back on the
  # bounding box -- for this box, from a viewpoint where the lid hides the tray, that is the honest
  # answer and it hands the segment to the operator instead of dropping the bread.
  placement_support_required: true
  # Needed to place INSIDE the box at all: perception reconstructs it as a filled convex hull.
  placement_into_surface: true
  # The hand camera looks ACROSS this box, so its near wall and raised lid hide most of the tray
  # floor -- on 2026-09-07_14-56-40 only a 3.5 cm strip of a ~9 cm floor came back, and every
  # candidate placement "rested" on the lid at z=0.21. Count the enclosed unobserved cells as floor
  # at the level of the floor seen around them. This is the one setting here that places onto
  # surface the robot did not see; placement_min_seen_frac is the guard.
  placement_fill_occluded: true
  placement_min_seen_frac: 0.25
  # This box's tray floor comes back with a ~1.7 cm spread over a 7 cm window -- stereo noise on
  # plain cardboard, not real relief -- and at the 8 mm default nothing on it counts as one level
  # patch. 12 mm is what this reconstruction needs; it is also how much genuine slope a placement is
  # then allowed to sit on, so it belongs to this task and not to the default.
  placement_flatness_tol: 0.012
  voxel_downsample_size: 0.005
  num_particles: 512
  opt_steps_per_skeleton: 600
  transit_apex_height: 0.075
  transit_apex_min_dist: 0.10
  time_dilation_factor_literal: 1.0
  posture_selection_seeds: 12
  posture_grasp_roll: true
  blend_trajectory: true
  blend_mode: vae
  blend_ops: [Pick, MoveFree, MoveHolding, Place, GoToInitial]
  blend_smoothing: 3.0e-4
  blend_boundary_speed: 0.07
  blend_vae_sample_target: false
  blend_max_duration_mult: 2.0
  blend_vel_slack: 1.0
  blend_acc_slack: 1.0

hitl:
  enabled: true
  proposal_model: "gemini-2.5-pro"
  vlm_model: "gemini-2.5-flash"
  verify_retries: 1
  verify_enforced: true
  save_vlm_io: true
  classify_initial: false
hugginface_slug: "4_bread_box"

prompt: "place the bread on the plate, and then open the box and place the bread in the box"
num_episodes: 20

