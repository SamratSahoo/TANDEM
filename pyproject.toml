[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-tamp"
version = "0.1.0"
description = "Human-in-the-loop TAMP data collection for real robots"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Samrat Sahoo" }]
keywords = ["robotics", "tamp", "human-in-the-loop", "data-collection", "manipulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base install is PURE PYTHON. Nothing here imports torch, CUDA, a camera SDK or a robot
# client -- that is what makes `pip install tandem-tamp && tandem ui` work on a laptop.
# The heavy stack lives in the pixi runtime that `tandem init` builds.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "numpy>=1.24",
    "platformdirs>=4.0",
    "tomlkit>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Phase planning is tandem's own now, so its model client and image handling are tandem's
    # dependencies rather than the planner's. Both are pure Python (google-genai pulls httpx,
    # google-auth and websockets; Pillow ships wheels everywhere), so the laptop install stays a
    # laptop install -- no torch, no CUDA, no camera SDK.
    "google-genai>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
export = ["av>=11.0", "pyarrow>=15.0", "huggingface_hub>=0.23"]
rerun = ["rerun-sdk==0.27.3"]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/SamratSahoo/tandem"
Issues = "https://github.com/SamratSahoo/tandem/issues"

[project.scripts]
tandem = "tandem.cli.app:main"

# Planners a profile's `planner.backend` can name. A planner in its own package registers here the
# same way, under its own name, and tandem finds it without being changed (tandem.planners.registry).
# TiPToP also ships built in; this entry is the same factory, and says so to anything reading the
# group rather than tandem's own table.
[project.entry-points."tandem.planners"]
tiptop = "tandem.planners.tiptop:FACTORY"

# Who carries out a human phase (hitl.human_executor). tandem registers its own in code as well, so an
# install whose metadata predates this table still finds it; a package that ships another executor
# declares it the same way, pointing at an ExecutorFactory. See tandem/executors/base.py.
[project.entry-points."tandem.human_executors"]
teleop = "tandem.executors.teleop:FACTORY"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tandem*"]

# No planner sources ship in the wheel: a planner's runtime recipe fetches them, pinned, at install
# (tandem/planners/runtime.py). What a planner package does ship is small and its own -- the patches its
# recipe applies to the fetched trees, and files no public repository has (TiPToP's two checkpoints).
[tool.setuptools.package-data]
tandem = [
    "resources/**/*",
    "server/static/**/*",
    "planners/*/patches/*",
    "planners/*/assets/**/*",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "src/tandem/export/lerobot_v3.py",
    "src/tandem/teleop/driver.py",
    "src/tandem/teleop/spacemouse.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the built runtime and/or real hardware"]
