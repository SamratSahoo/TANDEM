name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Rich prints box-drawing and colour by default; CI logs are neither a terminal nor
  # improved by escape codes.
  NO_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check src/tandem tools tests

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10, so every version that claim covers is exercised.
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev,export]'

      - name: Test
        # The suite spawns a stand-in driver and drives a real state machine over pipes and
        # signals, so it is timing-sensitive rather than slow; the timeout is a hang guard.
        timeout-minutes: 10
        run: pytest -q --durations=10

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist

      - name: The wheel must be small, carry no planner sources, and carry what planners ship
        # Planner sources are fetched at install by each planner's runtime recipe, never shipped: two of
        # TiPToP's three trees are under NVIDIA's licence. What a planner package does ship is its own --
        # the patches its recipe applies and files no public repository has -- and those only exist as
        # package-data globs, so a wheel that silently dropped them would install a runtime that cannot
        # be patched, and nothing else would notice.
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "tandem/resources/profile_template.yml",
              "tandem/server/static/index.html",
              "tandem/server/static/app.js",
              "tandem/server/static/pages/collect.js",
              "tandem/planners/runtime.py",
              "tandem/planners/tiptop/recipe.py",
              "tandem/planners/tiptop/sidecar.py",
              "tandem/planners/sidecar_kit/tandem_sidecar.py",
              "tandem/planners/tiptop/patches/0001-tiptop-config-from-env.patch",
              "tandem/planners/tiptop/assets/vae_full_v2.pt",
              "tandem/planners/tiptop/assets/rnd_droid.pt",
              # `tandem profile create --preset paper`: tandem's half and TiPToP's.
              "tandem/resources/presets/paper.yml",
              "tandem/planners/tiptop/presets/paper.yml",
              # `tandem planners new` writes a plugin package from these; a wheel without them scaffolds nothing.
              "tandem/resources/scaffold/pyproject.toml.tmpl",
              "tandem/resources/scaffold/package/planner.py.tmpl",
              "tandem/resources/scaffold/package/sidecar.py.tmpl",
              "tandem/resources/scaffold/tests/test_conformance.py.tmpl",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit("wheel is missing package data:\n  " + "\n  ".join(missing))

          markers = ("_vendor/", "tiptop_run.py", "tamp_domain.py", "curobolib/", "pixi.toml", "pixi.lock")
          planner = sorted(n for n in names if any(m in n for m in markers))
          if planner:
              sys.exit("wheel carries planner sources it should fetch instead:\n  " + "\n  ".join(planner[:20]))

          size = wheel.stat().st_size / 1e6
          print(f"{wheel.name}: {size:.1f} MB, {len(names)} files")
          # About 4 MB, nearly all of it the two checkpoints. A canary for sources creeping back in.
          if size > 8:
              sys.exit(f"wheel grew to {size:.1f} MB; something is shipping that a recipe should fetch")
          PY

      - name: Every optional extra must still resolve
        # No test imports rerun-sdk and it is pinned to an exact version, so a yank or a
        # missing wheel would only be discovered by a user running `traj open`.
        run: |
          for extra in export rerun dev; do
            echo "resolving [$extra]"
            pip install --dry-run --quiet "dist/$(ls dist | head -1)[$extra]" >/dev/null
          done

      - name: Install into a clean environment
        # The promise is that one install command gives a working CLI. Installing from the
        # built wheel, into an environment that has never seen the source tree, is the only
        # way to test that promise rather than the checkout.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl

      - name: Smoke-test the installed CLI
        env:
          TANDEM_CONFIG_DIR: /tmp/tandem-ci/config
          TANDEM_DATA_ROOT: /tmp/tandem-ci/data
          TANDEM_STATE_DIR: /tmp/tandem-ci/state
          TANDEM_SHARE_DIR: /tmp/tandem-ci/share
        run: |
          /tmp/clean/bin/tandem --version
          # --viz-only is the laptop path: no GPU, no robot, no cameras. It has to work on a
          # bare runner, because that is the same situation.
          /tmp/clean/bin/tandem init --viz-only --yes
          /tmp/clean/bin/tandem profile list --json
          /tmp/clean/bin/tandem traj list --json
          /tmp/clean/bin/tandem runtime status --json
          /tmp/clean/bin/tandem planners list --json
          /tmp/clean/bin/tandem planners info tiptop --json
          /tmp/clean/bin/tandem executors list --json
          # From the wheel's own templates, into a directory the installed CLI has never seen.
          /tmp/clean/bin/tandem planners new smoke --sidecar --dir /tmp/tandem-ci/smoke-planner
          # doctor exits non-zero when a check fails, which it will here (no GPU runtime, no
          # Gemini key). What matters is that it runs and reports rather than crashing.
          /tmp/clean/bin/tandem doctor --no-hardware --json || true

      - name: The installed CLI must not have pulled in torch or a camera SDK
        run: |
          /tmp/clean/bin/python - <<'PY'
          import importlib.util, sys
          heavy = [m for m in ("torch", "cv2", "open3d", "curobo", "cutamp", "tiptop")
                   if importlib.util.find_spec(m) is not None]
          if heavy:
              sys.exit(f"the base install pulled in {heavy}; the laptop path is broken")
          print("base install is clean")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 14

  planner-sources:
    # The sidecar calls into a planner tandem no longer ships, so the only check that it calls it
    # correctly runs here, against the exact commits TiPToP's recipe pins, fetched the way an install
    # fetches them.
    name: planner sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Fetch the pinned sources into an offline bundle
        run: python tools/bundle.py --planner tiptop --only tiptop --only cuTAMP --out "$RUNNER_TEMP/planner-sources"

      - name: Check the sidecar and the capability declaration against them
        # With TANDEM_PLANNER_SOURCES set, a tree missing from it FAILS the static checks rather than
        # skipping them (tests/planner_sources.py), so this job cannot pass by checking nothing.
        env:
          TANDEM_PLANNER_SOURCES: ${{ runner.temp }}/planner-sources
        run: pytest -q -rs tests/test_planners.py tests/test_sidecar_legs.py tests/test_packaging.py tests/test_tiptop_bump.py tests/test_review_tiptop.py tests/test_tiptop_placement.py

      - name: Install TiPToP's runtime sources the way an install does, short of the GPU build
        # Fetch, trim, patch and place the checkpoints, against GitHub, from the recipe's pins. Only the
        # pixi solve and the CUDA kernel build are left out; they need a GPU workstation.
        env:
          TANDEM_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: |
          python - <<'PY'
          from tandem.planners.tiptop.factory import FACTORY

          runtime = FACTORY.runtime()
          runtime.fetch(log=print)
          runtime.place_assets(log=print)
          status = runtime.inspect()
          stale = [s.name for s in status.sources if not s.current]
          assert not stale, f"not at their pins after a fetch: {stale}"
          assert all(s.verified for s in status.sources), "a fetched commit was not verified"
          print(runtime.describe(status))
          PY

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check the single-page app
        # There is no bundler, so nothing else parses this code before a browser does. A
        # syntax error would otherwise ship and only show up as a blank page.
        run: |
          set -e
          fail=0
          for f in $(find src/tandem/server/static -name '*.js'); do
            cp "$f" /tmp/check.mjs
            if node --check /tmp/check.mjs; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"; fail=1
            fi
          done
          exit $fail

      - name: Every import must resolve to a file that exists
        # Bare ES modules are resolved by the browser at runtime, so a typo'd path is a
        # 404 at load rather than a build error.
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          static = Path("src/tandem/server/static")
          broken = []
          for path in static.rglob("*.js"):
              for spec in re.findall(r"""from\s+["']([^"']+)["']""", path.read_text()):
                  if not spec.startswith("."):
                      broken.append(f"{path}: bare specifier {spec!r} (no bundler to resolve it)")
                      continue
                  if not (path.parent / spec).resolve().is_file():
                      broken.append(f"{path}: imports {spec!r}, which does not exist")
          if broken:
              sys.exit("\n".join(broken))
          print("every module import resolves")
          PY
